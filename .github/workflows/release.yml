name: Publish versioned GitHub Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analytical-reading-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate repository and download packages
        run: |
          python scripts/validate.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          python scripts/build_packages.py
      - name: Create release only for a new SemVer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import sys; sys.path.insert(0, "scripts"); from validate import VERSION; print(VERSION)')"
          TAG="v${VERSION}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. No changes made."
            exit 0
          fi
          gh release create "${TAG}" \
            "dist/analytical-reading-agent-skill-v${VERSION}.zip" \
            "dist/workbuddy-analytical-reading-v${VERSION}.zip" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "How to Read a Book Skill ${TAG}" \
            --notes "Release ${TAG}: evidence-first four-level reading; WorkBuddy marketplace edition and portable Agent Skills. See CHANGELOG.md for changes. Static validation passed; WorkBuddy marketplace review and model behavior validation remain separate steps."
