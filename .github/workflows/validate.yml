name: Validate and package reading skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check skill structure
        run: python scripts/validate.py
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build installable ZIP packages
        run: python scripts/build_packages.py
      - name: Upload packages for download
        uses: actions/upload-artifact@v4
        with:
          name: analytical-reading-v2.1.0-packages
          path: dist/*.zip
          if-no-files-found: error
